[package]
name = "codex-mobile-client"
version = "0.1.0"
edition = "2024"
description = "Shared mobile client library for Codex iOS and Android apps"
license-file = "../../../LICENSE"

[lib]
name = "codex_mobile_client"
# Consumers embed the rlib. Platform packaging explicitly selects staticlib
# (iOS) or cdylib (Android/host binding extraction), avoiding an unnecessary iOS
# dylib link before the real app supplies its deployment target/frameworks.
crate-type = ["lib"]

[dependencies]
uniffi = { version = "0.31.0", features = ["tokio"] }
iroh = { version = "1.0.3", optional = true }
codex-app-server = { workspace = true }
codex-app-server-client = { workspace = true }
codex-app-server-protocol = { workspace = true }
codex-slingshot = { path = "../codex-slingshot", default-features = false }
codex-protocol = { workspace = true }
codex-core = { workspace = true }
codex-exec-server = { workspace = true }
codex-file-system = { workspace = true }
codex-utils-path-uri = { workspace = true }
bytes = { workspace = true }
codex-login = { workspace = true }
codex-shell-command = { workspace = true }
codex-config = { workspace = true }
codex-cloud-config = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-feedback = { workspace = true }
codex-arg0 = { workspace = true }
alleycat-bridge-core = { workspace = true }
alleycat-pi-bridge = { workspace = true }
alleycat-claude-bridge = { workspace = true }
alleycat-opencode-bridge = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio-tungstenite = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
lru = { workspace = true }
chrono = { workspace = true }
regex = { workspace = true }
base64 = { workspace = true }
russh = { workspace = true }
futures = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
reqwest = { workspace = true }
tracing-subscriber = { workspace = true }
shlex = { workspace = true }
linkify = "0.10"
unicode-segmentation = "1"

[features]
default = ["remote-alleycat", "remote-pairing", "remote-cli"]
remote-alleycat = ["dep:iroh", "remote-cli"]
remote-pairing = []
remote-cli = ["codex-slingshot/json-line-transport"]
rpc-trace = []
# Qualification only: native JIT-disabled V8, without the desktop memory sandbox.
# Not enabled by normal app builds or on Android/desktop.
alma-code-mode-probe = ["dep:codex-code-mode-runtime", "dep:codex-code-mode-protocol"]

[dev-dependencies]
tempfile = "3"

[build-dependencies]
uniffi = { version = "0.31.0", features = ["build"] }

[target.'cfg(all(target_os = "ios", not(target_abi = "macabi")))'.dependencies]
codex-code-mode-protocol = { workspace = true, optional = true }
codex-code-mode-runtime = { workspace = true, optional = true }
codex-apply-patch = { workspace = true }
# iSH backend pinned to the exact revision validated by the ALMA phone probes.
ish-embed-host = { git = "https://github.com/dnakov/litter-ish.git", rev = "4f783cd957b83de3019d6a843408d5bb3ff902c7" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"
openssl-sys = { version = "0.9", features = ["vendored"] }
portable-pty = "0.9"
flate2 = "1"
tar = "0.4"
rusqlite = { version = "0.39.0", features = ["bundled"] }
