name: AlmaBackgroundProbe
options:
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    DEVELOPMENT_TEAM: C6635V7W82
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_OBJC_ARC: YES
targets:
  AlmaBackgroundProbe:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../ios_probe/.cache/payload
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alma.litter.background-probe
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "$(SRCROOT)/../ios_probe/.cache/cargo/aarch64-apple-ios/release/libalma_ish_phone_probe.a"
          - "-lsqlite3"
          - "-lc++"
    info:
      path: .cache/Info.plist
      properties:
        CFBundleDisplayName: Alma Background Probe
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "6"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: Scene
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [com.alma.litter.background-probe.work]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: BackgroundTasks.framework
      - sdk: CoreFoundation.framework
