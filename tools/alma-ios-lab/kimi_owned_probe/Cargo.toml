[package]
name = "kimi-owned-probe"
version = "0.1.0"
edition = "2021"

[workspace]
exclude = [".cache/owned-source/embed"]

[dependencies]
ish-embed-host = { path = ".cache/owned-source/embed/host" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde_json = "1"
base64 = "0.22"
