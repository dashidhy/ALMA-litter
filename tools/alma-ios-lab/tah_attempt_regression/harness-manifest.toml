[package]
name="alma-tah-attempt-regression"
version="0.0.0"
edition="2024"
[workspace]
[lib]
path="lib.rs"
doctest=false
[dependencies]
serde={ version="=1.0.228", features=["derive"] }
serde_json={ version="=1.0.149" }
sha2={ version="=0.10.9" }
base64={ version="=0.22.1" }
uuid={ version="=1.22.0", features=["v4"] }
uniffi={ version="=0.31.0" }
libc={ version="=0.2.191" }
[profile.dev]
debug=0
opt-level=0
incremental=false
[profile.test]
debug=0
opt-level=0
incremental=false
