name: AlmaBackendProbe
options:
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    DEVELOPMENT_TEAM: C6635V7W82
    CODE_SIGN_STYLE: Automatic
    CLANG_ENABLE_OBJC_ARC: YES
targets:
  AlmaBackendProbe:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: .cache/payload
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alma.litter.backend-probe
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "$(SRCROOT)/../../../shared/rust-bridge/target/aarch64-apple-ios/ios-dev/libalma_backend_probe.a"
          - "-lsqlite3"
          - "-lc++"
    info:
      path: .cache/Info.plist
      properties:
        CFBundleDisplayName: Alma Backend Probe
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: Scene
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies:
      - sdk: UIKit.framework
      - sdk: Foundation.framework
      - sdk: CoreFoundation.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: Network.framework
