[package]
name = "alma-session-agent-tests"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "lib.rs"

[dependencies]
libc = "=0.2.191"
serde = { version = "1", features = ["derive"] }
