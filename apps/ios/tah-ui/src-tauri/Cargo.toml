[package]
name = "alma-tah-ui"
version = "0.2.0"
edition = "2024"
workspace = "../../../../shared/rust-bridge"

[lib]
name = "alma_tah_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_os = "ios")'.dependencies]
codex-mobile-client = { path = "../../../../shared/rust-bridge/codex-mobile-client", default-features = false, features = ["alma-code-mode-probe"] }
objc2-ui-kit = { version = "=0.3.2", default-features = false, features = ["std", "UIViewController", "UIResponder", "UIInterface"] }
